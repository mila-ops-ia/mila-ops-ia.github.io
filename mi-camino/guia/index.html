<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Guía completa + 10 prompts clave · Milagros Sanabria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root { --bg:#4f47b3; --card:#fff; --ink:#1c1c27; --muted:#5d5d75; --violet:#4f47b3; --line:#d5d2ee; --err:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg:#37318a; --card:#1f1e2e; --ink:#f2f1fb; --muted:#b5b3cc; --violet:#c3beff; --line:#38365a; --err:#ffb4ab; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:Inter,system-ui,sans-serif; line-height:1.55; padding-block:24px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
main { width:100%; max-width:440px; background:var(--card); border-radius:18px; padding:30px 26px; display:grid; gap:15px; }
img { width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid var(--violet); }
h1 { margin:0; font-family:Montserrat,system-ui,sans-serif; font-size:29px; font-weight:800; line-height:1.12; color:var(--violet); text-wrap:balance; }
p { margin:0; }
.sub { color:var(--muted); font-size:15px; }
form { display:grid; gap:9px; }
label { font-size:13px; font-weight:600; }
input { width:100%; font:16px Inter,system-ui,sans-serif; color:var(--ink); background:transparent; padding:12px 13px; border:1.5px solid var(--line); border-radius:10px; }
input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--violet); outline-offset:2px; }
button { font:600 16px Inter,system-ui,sans-serif; color:var(--card); background:var(--violet); border:0; border-radius:10px; padding:12px; cursor:pointer; }
button:disabled { opacity:.65; cursor:wait; }
#error { min-height:20px; color:var(--err); font-size:14px; font-weight:500; }
.pedir { border-top:1px solid var(--line); padding-top:14px; font-size:14px; color:var(--muted); }
.pedir a { display:inline-block; color:var(--violet); font-weight:600; overflow-wrap:anywhere; padding-block:3px; }
</style>

<script>
(function () {
  var d = JSON.parse(document.getElementById('datos').textContent);
  var bytes = function (t) { return Uint8Array.from(atob(t), function (x) { return x.charCodeAt(0); }); };
  var f = document.getElementById('f'), c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('error');
  async function entrar(valor) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(valor), 'PBKDF2', false, ['deriveKey']);
    var k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(d.s), iterations: d.n }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var txt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(d.i) }, k, bytes(d.c));
    document.open(); document.write(new TextDecoder().decode(txt)); document.close();
  }
  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    e.textContent = ''; b.disabled = true; b.textContent = 'Abriendo…';
    try { await entrar(c.value.trim().toLowerCase()); }
    catch (x) {
      e.textContent = 'Esa contraseña no es. Revisala o pedímela por correo.';
      b.disabled = false; b.textContent = 'Entrar'; c.select();
    }
  });
  var directo = location.hash.match(/^#clave=(.+)$/);
  if (directo) {
    history.replaceState(null, '', location.pathname + location.search);
    b.disabled = true; b.textContent = 'Abriendo…';
    (async function () {
      try { await entrar(decodeURIComponent(directo[1]).trim().toLowerCase()); }
      catch (x) { b.disabled = false; b.textContent = 'Entrar'; e.textContent = 'El link no funcionó. Escribí la contraseña del correo.'; }
    })();
  }
})();
</script>
