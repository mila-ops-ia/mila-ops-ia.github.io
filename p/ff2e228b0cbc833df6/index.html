    const t = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(d.i) }, k, b(d.c)));
    const p = new DOMParser().parseFromString(t, "text/html");
    document.replaceChild(document.adoptNode(p.documentElement), document.documentElement);
  } catch (e) {
    document.getElementById("m").textContent = "Este link no está completo. Pedile a quien te lo envió que lo comparta de nuevo.";
  }
})();
